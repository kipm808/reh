name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: reh
            final_name: reh_linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: reh.exe
            final_name: reh_windows.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: reh
            final_name: reh_macos

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install MUSL Tools (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build Release
        shell: bash
        run: |
          # Use the specific target for static linking on Linux
          cargo build --release --target ${{ matrix.target }} --verbose

      - name: Prepare Binary and Set Permissions
        shell: bash
        run: |
          mkdir -p staging
          # Path includes the target triple when using --target
          SOURCE_PATH="target/${{ matrix.target }}/release/${{ matrix.artifact_name }}"
          
          if [ -f "$SOURCE_PATH" ]; then
            cp "$SOURCE_PATH" "staging/${{ matrix.final_name }}"
            chmod +x "staging/${{ matrix.final_name }}"
          else
            echo "Error: Binary not found at $SOURCE_PATH"
            exit 1
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.final_name }}
          path: staging/${{ matrix.final_name }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Ensure Executable Bit for Release
        run: chmod +x release_assets/*

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
