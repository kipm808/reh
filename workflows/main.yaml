name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: reh
            final_name: reh_linux
          - os: windows-latest
            artifact_name: reh.exe
            final_name: reh_windows.exe
          - os: macos-latest
            artifact_name: reh
            final_name: reh_macos

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install System Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libaubio-dev clang

      - name: Install System Dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install aubio llvm

      - name: Build Release
        run: cargo build --release --verbose
        env:
          # Use a broader check for Clang on Linux
          LIBCLANG_PATH: ${{ matrix.os == 'ubuntu-latest' && '/usr/lib/llvm-14/lib' || '' }}

      - name: Prepare Binary
        shell: bash
        run: |
          # Create a staging area to avoid path confusion
          mkdir -p staging
          
          # Fix 1: Robust existence check and copy
          if [ -f "target/release/${{ matrix.artifact_name }}" ]; then
            cp "target/release/${{ matrix.artifact_name }}" "staging/${{ matrix.final_name }}"
            echo "Successfully staged ${{ matrix.final_name }}"
          else
            echo "Error: target/release/${{ matrix.artifact_name }} was not found!"
            ls -R target/release/
            exit 1
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          # Fix 2: Point directly to the staging folder
          name: ${{ matrix.final_name }}
          path: staging/${{ matrix.final_name }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
