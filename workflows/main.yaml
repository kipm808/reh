name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: reh
            asset_name: reh_linux
          - os: windows-latest
            artifact_name: reh.exe
            asset_name: reh_windows.exe
          - os: macos-latest
            artifact_name: reh
            asset_name: reh_macos

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install System Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libaubio-dev clang

      - name: Install System Dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install aubio llvm

      - name: Build Release
        run: cargo build --release --verbose
        env:
          # Helps bindgen find clang on Linux runners
          LIBCLANG_PATH: ${{ matrix.os == 'ubuntu-latest' && '/usr/lib/llvm-14/lib' || '' }}

      - name: Upload Binaries to Actions
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/release/${{ matrix.artifact_name }}

release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          # This downloads every matrix artifact into its own subdirectory
          path: artifacts 

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          # We use a wildcard to grab the files from the subdirectories
          files: |
            artifacts/reh_windows.exe/reh.exe
            artifacts/reh_macos/reh
            artifacts/reh_linux/reh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
