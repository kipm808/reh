name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: reh
            asset_name: reh_linux
          - os: windows-latest
            artifact_name: reh.exe
            asset_name: reh_windows.exe
          - os: macos-latest
            artifact_name: reh
            asset_name: reh_macos

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install System Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libaubio-dev clang

      - name: Install System Dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install aubio llvm

      - name: Build Release
        run: cargo build --release --verbose
        env:
          LIBCLANG_PATH: ${{ matrix.os == 'ubuntu-latest' && '/usr/lib/llvm-14/lib' || '' }}

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          # We name the artifact the same as the asset name for clarity
          name: ${{ matrix.asset_name }}
          path: target/release/${{ matrix.artifact_name }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          # This pulls all artifacts from the previous job into an 'assets' folder
          path: assets

      - name: Display structure of downloaded files
        run: ls -R assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          # V4 of download-artifact creates a subfolder for each artifact name
          files: |
            assets/reh_windows.exe/reh.exe
            assets/reh_macos/reh
            assets/reh_linux/reh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
