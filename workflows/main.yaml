name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ] # Triggers release logic on tags like v1.0.1
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write  # Allows the action to create releases and upload assets

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: audio_player_linux
            asset_name: audio_player_linux
          - os: windows-latest
            artifact_name: audio_player.exe
            asset_name: audio_player_windows.exe
          - os: macos-latest
            artifact_name: audio_player
            asset_name: audio_player_macos

     steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install System Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libaubio-dev clang

      - name: Install System Dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install aubio llvm

      - name: Build Release
        run: cargo build --release --verbose
        env:
          # This helps bindgen find Clang on some runners
          LIBCLANG_PATH: ${{ matrix.os == 'ubuntu-latest' && '/usr/lib/llvm-14/lib' || '' }}

      - name: Upload Binaries to Actions
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/release/${{ matrix.artifact_name }}

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            audio_player_windows.exe/reh.exe
            audio_player_macos/reh_macos
            audio_player_linux/reh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
